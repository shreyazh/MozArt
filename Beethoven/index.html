<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MozArt Guitar Tuner</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #fff;
    }

    #string-select {
      margin: 20px 0;
    }

    select {
      padding: 10px;
      font-size: 1.2rem;
      background-color: #111;
      color: #fff;
      border: 1px solid #444;
      border-radius: 5px;
    }

    #tuner {
      margin-top: 30px;
      width: 80%;
      max-width: 500px;
    }

    #note-display {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .progress-container {
      width: 100%;
      height: 20px;
      background-color: #333;
      border-radius: 10px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background-color: #0f0;
      transition: width 0.2s ease;
    }

    button {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 1.2rem;
      color: #fff;
      background-color: #444;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MozArt Guitar Tuner</h1>
    
    <div id="string-select">
      <label for="strings">Choose a string:</label>
      <select id="strings">
        <option value="E4">1st String - E4</option>
        <option value="B3">2nd String - B3</option>
        <option value="G3">3rd String - G3</option>
        <option value="D3">4th String - D3</option>
        <option value="A2">5th String - A2</option>
        <option value="E2">6th String - E2</option>
      </select>
    </div>
    
    <div id="tuner">
      <p id="note-display">Listening...</p>
      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>
    </div>
    
    <button id="start-button">Start Tuning</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
